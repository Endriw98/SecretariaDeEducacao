<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secretaria de Educação - Portal de Acesso</title>
    <link rel="stylesheet" href="css/login.css">
    <script src="/_sdk/element_sdk.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
</head>

<body class="gradient-bg">
    <div class="h-full w-full flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md fade-in">
            <!-- Logo e Cabeçalho -->
            <div class="text-center mb-8">
                <div class="flex justify-center mb-4">
                    <div class="bg-white rounded-full p-4 shadow-lg">
                        <i data-lucide="book-open" style="width: 48px; height: 48px; color: #0369a1;"></i>
                    </div>
                </div>
                <h1 class="text-white text-3xl font-bold mb-2">Secretaria de Educação</h1>
                <p class="text-blue-100 text-sm">Portal de Acesso</p>
            </div><!-- Card de Login -->
            <div class="bg-white rounded-2xl card-shadow p-8 mb-6">
                <!-- Título do Formulário -->
                <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Faça seu login</h2><!-- Formulário -->
                <form id="loginForm" class="space-y-5">
                    <!-- Campo E-mail/Usuário -->
                    <div>
                        <label for="email" class="block text-sm font-semibold text-gray-700 mb-2"> <span
                                class="flex items-center gap-2"> <i data-lucide="mail"
                                    style="width: 16px; height: 16px;"></i> E-mail ou Usuário </span> </label> <input
                            type="text" id="email" name="email" placeholder="seu.email@exemplo.com"
                            class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg bg-gray-50 text-gray-800 placeholder-gray-400 transition-all input-focus"
                            required>
                    </div><!-- Campo Senha -->
                    <div>
                        <label for="password" class="block text-sm font-semibold text-gray-700 mb-2"> <span
                                class="flex items-center gap-2"> <i data-lucide="lock"
                                    style="width: 16px; height: 16px;"></i> Senha </span> </label> <input
                            type="password" id="password" name="password" placeholder="••••••••"
                            class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg bg-gray-50 text-gray-800 placeholder-gray-400 transition-all input-focus"
                            required>
                    </div><!-- Lembrar Senha e Link de Recuperação -->
                    <div class="flex items-center justify-between pt-2">
                        <label class="flex items-center gap-2 cursor-pointer"> <input type="checkbox" id="remember"
                                name="remember" class="w-4 h-4 border-2 border-blue-300 rounded cursor-pointer"> <span
                                class="text-sm text-gray-600">Lembrar-me</span> </label> <a href="#"
                            class="text-sm text-blue-600 hover:text-blue-700 font-medium transition-colors"> Esqueceu a
                            senha? </a>
                    </div><!-- Botão Login --> <button id="btn-login" 
                        class="w-full bg-gradient-to-r from-blue-500 to-blue-700 text-white font-bold py-3 rounded-lg transition-all duration-200 btn-hover mt-6" type="submit" onclick="(()=>window.location.href = 'main.html')()">
                        <span class="flex items-center justify-center gap-2"> <i data-lucide="log-in"
                                style="width: 20px; height: 20px;"></i> Entrar </span> </button>
                </form><!-- Divisor -->
                <div class="flex items-center gap-4 my-6">
                    <div class="h-px bg-gray-200 flex-1"></div><span class="text-gray-400 text-xs">ou</span>
                    <div class="h-px bg-gray-200 flex-1"></div>
                </div><!-- Link de Cadastro -->
                <p class="text-center text-gray-600 text-sm">Não tem uma conta? <a href="#"
                        class="text-blue-600 hover:text-blue-700 font-bold transition-colors">Cadastre-se aqui</a></p>
            </div><!-- Rodapé de Informações -->
            <div class="text-center text-blue-100 text-xs space-y-1">
                <p>Secretaria de Educação © 2024</p>
                <p><a href="#" class="hover:text-white transition-colors">Termos de Uso</a> • <a href="#"
                        class="hover:text-white transition-colors">Privacidade</a> • <a href="#"
                        class="hover:text-white transition-colors">Suporte</a></p>
            </div>
        </div>
    </div>
    <script src="js/action.js"></script>

</body>

</html>
